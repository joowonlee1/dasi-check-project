<!doctype html><html lang="ko"><meta charset="utf-8"><body><script>
const send=(type,data={})=>parent.postMessage({isStreamlitMessage:true,type,...data},'*');
let args={},pending=false,lastCount=0,open=false,pocket=false;
// 대화창 크기: 0 작게 · 1 보통 · 2 크게 (창을 다시 열어도 유지)
const SIZES=[{w:320,h:45,f:14},{w:380,h:55,f:15},{w:460,h:68,f:17},{w:560,h:78,f:19},{w:680,h:86,f:21},{w:820,h:90,f:23}];
let size=(()=>{try{const v=parent.__dhSize;return v===undefined?2:+v}catch(e){return 2}})();
let root,doc;try{doc=parent.document;}catch(e){doc=document;}
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function remove(){if(root)root.remove();}
(()=>{try{const W=parent,D=W.document;if(!W.__dpLiftInstalled){W.__dpLiftInstalled=1;const sc=D.createElement('script');sc.textContent="setInterval(function(){try{var h=document.getElementById('dotori-helper'),ui=document.getElementById('dotori-phone-ui'),box=document.getElementById('dotori-phone-box');if(!h)return;if(!ui||!box||ui.classList.contains('pocket')||!box.offsetParent){h.style.removeProperty('bottom');return;}var t=box.getBoundingClientRect().top;if(t>0)h.style.setProperty('bottom',(Math.ceil(innerHeight-t)+28)+'px','important');}catch(e){}},400);";D.head.appendChild(sc);}}catch(e){}})();
function snapshot(){
 let found=[];
 // 게임 iframe의 현재 보이는 글만 읽어요. 입력칸·숨겨진 정답 데이터는 읽지 않아요.
 for(const frame of doc.querySelectorAll('iframe')){
  if(frame===window.frameElement)continue;
  try{const el=frame.contentDocument.querySelector('main.wrap');if(el)found.push(el.innerText);}catch(e){}
 }
 return found.join('\n').slice(0,6000);
}
function ask(q){
 q=q.trim();if(!q||pending)return;
 pending=true;const visible=snapshot();render();
 send('streamlit:setComponentValue',{dataType:'json',value:{id:Date.now()+'-'+Math.random(),page:args.page,question:q,visible}});
}
function render(){
 {const _o=doc.getElementById('dotori-helper-style');if(_o)_o.remove();}if(!doc.getElementById('dotori-helper-style')){
  const s=doc.createElement('style');s.id='dotori-helper-style';s.textContent=`
 #dotori-helper{position:fixed;right:20px;bottom:64px;z-index:999980;font:600 16px/1.6 Pretendard Variable,Pretendard,system-ui,sans-serif;color:#293747}
 #dotori-helper button{font:800 15px/1.5 Pretendard Variable,Pretendard,system-ui,sans-serif;cursor:pointer;border:2px solid #8B5CF6;border-radius:12px;padding:9px 12px;background:#F5F3FF;color:#4C1D95}
 #dotori-helper .dh-box{position:relative}#dotori-helper .dh-box .launch{position:relative;display:flex;align-items:center;background:#F5F3FF!important;color:#3730A3!important;border:3px solid #8B5CF6!important;border-radius:22px!important;min-height:76px;padding:18px 26px 18px 112px!important;font:900 22px Pretendard Variable,Pretendard,system-ui,sans-serif!important;box-shadow:0 6px 18px #4C1D9555}#dotori-helper .dh-box .launch img{position:absolute;left:10px;bottom:4px;width:96px;height:106px;object-fit:contain;object-position:center bottom;pointer-events:none}#dotori-helper .dh-box .dh-pocket{position:absolute;top:-17px;right:14px;border:2px solid #fff!important;border-radius:999px!important;background:#7C3AED!important;color:#fff!important;font-weight:900!important;font-size:14px!important;padding:3px 12px!important;box-shadow:0 2px 6px #0003;z-index:2}#dotori-helper .tab{display:flex;align-items:center;justify-content:center;width:96px;height:96px;box-sizing:border-box;padding:6px!important;border:3px solid #8B5CF6!important;border-right:0!important;border-radius:22px 0 0 22px!important;background:#F5F3FF!important;box-shadow:0 6px 18px #4C1D9555}#dotori-helper .tab img{width:76px;height:76px;object-fit:contain}#dotori-helper.pocketed{right:0!important;bottom:150px!important}
 #dotori-helper .panel{width:min(390px,calc(100vw - 24px));max-height:75vh;display:flex;flex-direction:column;background:#fff;border:3px solid #8B5CF6;border-radius:20px;overflow:hidden;box-shadow:0 10px 35px #172B3A55}
 #dotori-helper .dh-size{display:flex;gap:4px;margin-left:auto}#dotori-helper .dh-size{align-items:center}#dotori-helper .dh-size button{padding:3px 10px!important;font-size:15px!important;font-weight:900!important;background:#fff!important;min-width:40px}#dotori-helper .dh-lv{display:flex;gap:3px;align-items:flex-end;margin:0 4px}#dotori-helper .dh-lv i{display:block;width:6px;background:#A78BFA;border-radius:2px;cursor:pointer;opacity:.45}#dotori-helper .dh-lv i.on{opacity:1;background:#fff}#dotori-helper .dh-lv i:nth-child(1){height:6px}#dotori-helper .dh-lv i:nth-child(2){height:9px}#dotori-helper .dh-lv i:nth-child(3){height:12px}#dotori-helper .dh-lv i:nth-child(4){height:15px}#dotori-helper .dh-lv i:nth-child(5){height:18px}#dotori-helper .dh-lv i:nth-child(6){height:21px}#dotori-helper .dh-size button:disabled{opacity:.4}#dotori-helper .panel .body,#dotori-helper .panel input,#dotori-helper .panel .quick button,#dotori-helper .panel form button,#dotori-helper .panel .note{font-size:1em!important}#dotori-helper .panel .note{font-size:.85em!important}#dotori-helper .head{background:#6D28D9;color:#fff;padding:10px 12px;font-weight:900;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
 #dotori-helper .head button{padding:4px 8px;font-size:13px;margin-left:0}#dotori-helper .body{padding:12px;overflow:auto;min-height:0}
 #dotori-helper .q,#dotori-helper .a{padding:9px 12px;border-radius:12px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}#dotori-helper .q{background:#EDE9FE}#dotori-helper .a{background:#F1F7F3}
 #dotori-helper .quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px}#dotori-helper .quick button{font-size:13px;padding:5px 8px}
 #dotori-helper form{display:flex;gap:6px;padding:10px 12px;border-top:1px solid #DDD6FE}#dotori-helper input{min-width:0;flex:1;font:inherit;border:2px solid #C4B5FD;border-radius:10px;padding:8px;color:#293747;background:#fff}
 #dotori-helper .note{font-size:13px;color:#475569}#dotori-helper button:focus-visible{outline:3px solid #F59E0B;outline-offset:2px}
 @media(max-width:600px){#dotori-helper{right:12px;bottom:56px}#dotori-helper .dh-box .launch{font-size:19px!important;min-height:60px;padding:12px 18px 12px 78px!important}#dotori-helper .dh-box .launch img{width:62px;height:72px}#dotori-helper .tab img{width:56px;height:56px}}
 `;doc.head.appendChild(s);
 }
 if(!root||!root.isConnected){doc.getElementById('dotori-helper')?.remove();root=doc.createElement('div');root.id='dotori-helper';doc.body.appendChild(root);}
 root.classList.toggle('pocketed',!open&&pocket);root.style.zIndex=open?'999995':'';const av=args.avatar?'<img alt="깡지" src="'+esc(args.avatar)+'">':'🤖';
 if(!open){root.innerHTML=pocket?`<button class="launch tab" aria-label="주머니에서 깡지 도우미 꺼내기" title="깡지 도우미 꺼내기">${av}</button>`:`<div class="dh-box"><button class="launch" aria-label="깡지 도우미 열기">${av}🤖 깡지 도우미</button><button class="dh-pocket" title="주머니에 넣기">🎒 넣기 ⌄</button></div>`;
 root.querySelector('.launch').onclick=()=>{open=true;pocket=false;render();};root.querySelector('.dh-pocket')?.addEventListener('click',()=>{pocket=true;render();});return;}
 root.innerHTML=`<section class="panel" aria-label="깡지 도우미" style="width:min(${SIZES[size].w}px,calc(100vw - 24px));max-height:${SIZES[size].h}vh;font-size:${SIZES[size].f}px"><div class="head">🤖 깡지 도우미<span class="dh-size"><button data-smaller ${size===0?'disabled':''} aria-label="창 작게" title="창 작게">가−</button><span class="dh-lv">${SIZES.map((_,i)=>`<i class="${i<=size?'on':''}" data-lv="${i}" title="${i+1}단계"></i>`).join('')}</span><button data-bigger ${size===SIZES.length-1?'disabled':''} aria-label="창 크게" title="창 크게">가+</button></span><button data-pocket>🎒 넣기</button><button data-close>닫기 ✕</button></div><div class="body"><div class="note">${esc(args.title||'홈')} 안내예요. 개인정보는 입력하지 마세요. AI 질문과 현재 보이는 게임 글은 답변을 위해 전송돼요.</div>${(args.answers||[]).map(x=>`<div class="q">${esc(x.q)}</div><div class="a">${esc(x.a)}</div>`).join('')}${pending?'<p>답변을 준비하고 있어요…</p>':''}</div><div class="quick"><button>사용법</button><button>이 화면 설명</button><button>힌트 줘</button></div><form><input maxlength="300" placeholder="도움이 필요한 부분을 물어보세요" aria-label="깡지에게 질문" ${pending?'disabled':''}><button ${pending?'disabled':''}>물어보기</button></form></section>`;
 root.querySelector('[data-close]').onclick=()=>{open=false;render();};const rs=d=>{size=Math.max(0,Math.min(SIZES.length-1,size+d));try{parent.__dhSize=size}catch(e){}render();};root.querySelector('[data-smaller]').onclick=()=>rs(-1);root.querySelectorAll('[data-lv]').forEach(x=>x.onclick=()=>rs(+x.dataset.lv-size));root.querySelector('[data-bigger]').onclick=()=>rs(1);root.querySelector('[data-pocket]').onclick=()=>{open=false;pocket=true;render();};
 root.querySelectorAll('.quick button').forEach(b=>{b.disabled=pending;b.onclick=()=>ask(b.textContent);});
 root.querySelector('form').onsubmit=e=>{e.preventDefault();ask(root.querySelector('input').value);};
 const body=root.querySelector('.body');body.scrollTop=body.scrollHeight;
}
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='streamlit:render')return;const next=e.data.args||{};if(next.page!==args.page){open=false;pending=false;}if(next.revision!==args.revision||(next.answers||[]).length!==lastCount){pending=false;}lastCount=(next.answers||[]).length;args=next;render();});
window.addEventListener('pagehide',remove);
const path=parent.location.pathname;const cleanup=setInterval(()=>{if(parent.location.pathname!==path){remove();clearInterval(cleanup);}},500);
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:0});
</script></body></html>
