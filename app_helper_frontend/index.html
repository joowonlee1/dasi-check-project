<!doctype html><html lang="ko"><meta charset="utf-8"><body><script>
const send=(type,data={})=>parent.postMessage({isStreamlitMessage:true,type,...data},'*');
let args={},pending=false,lastCount=0,open=false,pocket=true;

// 실제 버튼 영역을 기준으로 화면 안에 배치합니다.
function dhOverlap(a,b,gap=0){return a.left<b.right+gap&&a.right>b.left-gap&&a.top<b.bottom+gap&&a.bottom>b.top-gap;}
function dhLauncherPosition(view,obstacles){
 const pad=12,gap=16,left=view.left+pad,right=view.left+view.width-pad,top=view.top+pad,bottom=view.top+view.height-pad;
 const blocks=obstacles.filter(r=>r.width>0&&r.height>0&&r.right>view.left&&r.left<view.left+view.width&&r.bottom>view.top&&r.top<view.top+view.height);
 for(const size of [88,72,64,48,44]){
  if(size>view.width-2*pad||size>view.height-2*pad)continue;
  const baseline=view.top+view.height-88-size;
  const candidates=[{x:right-size,y:baseline},...blocks.map(r=>({x:right-size,y:r.top-gap-size})),
   {x:left,y:baseline},...blocks.map(r=>({x:left,y:r.top-gap-size})),{x:right-size,y:top},{x:left,y:top}];
  for(const c of candidates){
   const r={left:c.x,top:c.y,right:c.x+size,bottom:c.y+size};
   if(r.left>=left&&r.right<=right&&r.top>=top&&r.bottom<=bottom&&!blocks.some(b=>dhOverlap(r,b,gap)))return {...c,size,visible:true};
  }
 }

}

 }else{
  const obstacles=[];

   const node=doc.getElementById(id);if(!dhVisible(node))continue;

   // 본체 밖으로 나온 캐릭터 그림과 알림 애니메이션 여유도 포함합니다.
   if(id==='dotori-phone-launch'){

     box.left=Math.min(box.left,l);box.right=Math.max(box.right,l+w);box.top=Math.min(box.top,b-h);box.bottom=Math.max(box.bottom,b);}
   }
   const extra=node.classList.contains('alarm')?24:4;
   box={left:box.left-extra,top:box.top-extra,right:box.right+extra,bottom:box.bottom+extra};box.width=box.right-box.left;box.height=box.bottom-box.top;obstacles.push(box);
  }
  const p=dhLauncherPosition(view,obstacles);if(!p.visible){dhSet(root,'visibility','hidden');return;}x=p.x;y=p.y;
  const launch=root.querySelector('.tab');if(launch){for(const key of ['width','height','min-height'])dhSet(launch,key,p.size+'px');

 }
 dhSet(root,'left',Math.max(view.left+12,x)+'px');dhSet(root,'top',Math.max(view.top+12,y)+'px');dhSet(root,'right','auto');dhSet(root,'bottom','auto');
}
function scheduleLayout(){

function disposeLayout(){

function observeLayout(){

}
