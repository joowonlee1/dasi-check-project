<!-- 사진 편집은 로컬, AI 평가는 동의 후에만 전송 -->
<style>
#news-lab{--ink:#38285B;--main:#634796;--line:#D9CEEB;--pale:#F4F0FB;display:none;max-width:980px;margin:auto;padding:8px 4px 24px;color:var(--ink);font:600 17px/1.65 'Pretendard Variable',Pretendard,'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
#news-lab *{box-sizing:border-box}#news-lab [hidden]{display:none!important}
#news-lab h2{font-size:1.6rem;margin:12px 0 6px}#news-lab h3{font-size:1.22rem;margin:0}#news-lab p{margin:10px 0;overflow-wrap:anywhere}
#news-lab button,#news-lab input,#news-lab textarea,#news-lab select{font:inherit}
#news-lab button{cursor:pointer;border:1.5px solid var(--line);border-radius:12px;background:#EEE7F8;color:var(--ink);padding:11px 18px;min-height:46px;height:auto;line-height:1.6;white-space:normal;font-weight:800}
#news-lab button:hover:not(:disabled){background:#E2D7F1;transform:none}#news-lab button:disabled{opacity:.55;cursor:default}

#news-lab .nl-primary{background:var(--main);border-color:#51347F;color:#fff;box-shadow:0 3px 0 #432A6E}#news-lab .nl-primary:hover:not(:disabled){background:#50357D}
#news-lab .nl-quiet{background:#fff;box-shadow:none;font-size:.92rem}
#news-lab .nl-privacy{background:var(--pale);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:.9rem;color:#65547E}
#news-lab summary{cursor:pointer;font-weight:800}#news-lab .nl-steps{display:flex;gap:6px;list-style:none;padding:0;margin:18px 0;flex-wrap:wrap}
#news-lab .nl-steps li{flex:1;min-width:95px;border:1px solid var(--line);border-radius:10px;padding:7px;text-align:center;font-size:.88rem;background:#FBF9FE;color:#796A8D}
#news-lab .nl-steps button[aria-current=step]{background:#654797;color:#fff;border-color:#654797;font-weight:900}
#news-lab .nl-box{background:linear-gradient(145deg,#fff,#FAF8FE);border:1.5px solid var(--line);border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 6px 18px #50357D09}
#news-lab .nl-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
#news-lab .nl-muted{font-size:.92rem;color:#736182}#news-lab .nl-note{border-left:4px solid #9476BF;background:#F1EAF9;border-radius:12px;padding:12px 15px;margin:14px 0}
#news-lab .nl-actions{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;margin:20px 0 4px}
#news-lab .nl-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:#F4EFFA}
#news-lab #nl-stop{margin-left:auto}#news-lab .nl-status{font-size:.95rem;min-height:1.5em;margin:14px 0;color:#68517E}
#news-lab .nl-camera{max-width:740px;margin:18px auto 0;padding:10px 10px 20px;border:1px solid var(--line);border-radius:22px;background:#F0EAF7}
#news-lab .nl-camera:has(video[hidden]){display:none}#news-lab video{width:100%;height:auto;max-height:360px;aspect-ratio:16/9;object-fit:contain;background:#E5DDEC;border-radius:14px;display:block}
#news-lab #nl-capture{min-width:250px;min-height:60px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 28px}
#news-lab #nl-capture::before{content:'';width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--main);outline:2px solid #fff;flex:none}
#news-lab .nl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
#news-lab .nl-photo-card{min-width:0;border:1px solid var(--line);border-radius:16px;background:#F6F2FC;padding:14px}
#news-lab .nl-photo-label{display:block;font-weight:900;margin:0 0 10px;color:#51367C;font-size:1rem}
#news-lab canvas{display:block;width:100%;height:auto;background:#EBE4F3;border-radius:12px}
#news-lab label{display:block;font-weight:800;margin:12px 0 6px}#news-lab input[type=text],#news-lab textarea,#news-lab select{width:100%;min-width:0;border:1.5px solid #BFAAD9;border-radius:10px;background:#fff;color:#35264F;padding:10px 12px;line-height:1.65}
#news-lab textarea{resize:vertical}#news-lab .nl-sliders{background:#F3EDF9;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:16px 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
#news-lab .nl-sliders label{margin:0;font-size:.95rem}#news-lab input[type=range]{display:block;width:100%;min-height:34px;accent-color:#7454A5}
#news-lab output{font-weight:900;color:#654396;margin-left:5px}#news-lab .nl-error{color:#8B244D;background:#FFF0F5;border-radius:10px;padding:10px 12px;line-height:1.7}#news-lab .nl-error:empty{display:none}
#news-lab fieldset{border:1px solid var(--line);border-radius:12px;margin:12px 0;padding:12px 14px;min-width:0}#news-lab legend{font-weight:900;padding:0 5px}
#news-lab .nl-option{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid #DED3EE;background:#fff;border-radius:10px;margin:8px 0;font-size:.95rem;font-weight:600}
#news-lab input[type=radio],#news-lab input[type=checkbox]{accent-color:#694996;width:18px;height:18px;flex:0 0 18px;margin-top:5px}
#news-lab .nl-option:has(input:checked){background:#EDE4F8;border-color:#9274BA}#news-lab .nl-feedback{margin:8px 0;font-size:.95rem;color:#5A4377}
#news-lab .nl-headline{font-size:1.1rem;font-weight:900;margin:12px 0 4px;overflow-wrap:anywhere}#news-lab .nl-results-list{padding-left:22px;line-height:1.9}
@media(max-width:650px){#news-lab{font-size:16px}#news-lab .nl-grid{grid-template-columns:1fr}#news-lab .nl-box{padding:16px}#news-lab .nl-photo-card{padding:12px}#news-lab .nl-sliders{grid-template-columns:1fr;gap:12px}#news-lab .nl-steps li{min-width:80px;font-size:.82rem}#news-lab #nl-capture{min-width:0;width:100%}#news-lab .nl-toolbar button{flex:1 1 130px}#news-lab #nl-stop{margin-left:0}#news-lab .nl-section-head .nl-quiet{margin-left:auto}}
@media(prefers-reduced-motion:reduce){#news-lab *{scroll-behavior:auto!important;transition:none!important}}
#news-lab .nl-steps li{padding:0;border:0;background:none}#news-lab .nl-steps button{width:100%;height:100%;padding:8px 6px;font-size:.88rem;background:#FBF9FE}#news-lab .nl-steps button:disabled{opacity:.55;cursor:not-allowed}

#news-lab .nl-photo-card canvas {max-height:330px;object-fit:contain;}
#news-lab .nl-photo-card .nl-sliders {grid-template-columns:1fr;margin:12px 0;gap:6px;padding:10px;}
#news-lab .nl-photo-card .nl-sliders label {display:flex;align-items:center;gap:8px;font-size:.85rem;}
#news-lab .nl-photo-card .nl-sliders input {flex:1;min-width:50px;}
#news-lab .nl-photo-card .nl-sliders output {min-width:45px;}
#news-lab .nl-error {border:1px solid #E9B2C6;scroll-margin-top:32px;}
#news-lab .nl-attention {outline:3px solid #C084FC!important;outline-offset:3px;}
#news-lab .nl-report-head {text-align:center;background:linear-gradient(130deg,#EEE5FF,#F8F4FF);padding:22px;border-radius:18px;margin-bottom:18px;}
#news-lab .nl-report-head>span {font-size:.75rem;letter-spacing:.14em;color:#7C3AED;}
#news-lab .nl-report-head h3 {font-size:1.5rem;margin:8px 0;}
#news-lab .nl-report-card {border:1px solid #DDD0EE;border-radius:16px;padding:16px;background:#FBF9FF;margin-top:12px;min-width:0;}
#news-lab .nl-report-card h4 {margin:0 0 8px;font-size:1rem;}
#news-lab .nl-report-card p {margin:0;font-size:.95rem;}
#news-lab .nl-good {background:#F0FDF4;border-color:#B6E3C5;color:#166534;}
#news-lab .nl-improve {background:#FFF8EC;border-color:#F0D5A3;color:#854D0E;}
#news-lab .nl-after-card {border:2px solid #A78BFA;background:#F4EFFF;}
#news-lab .nl-chips {display:flex;gap:8px;flex-wrap:wrap;margin:16px 0;}
#news-lab .nl-chips span {background:#EEE5FF;color:#6D28D9;padding:7px 12px;border-radius:999px;font-size:.85rem;}
#news-lab .nl-review-summary {background:#EEE7F8;border-radius:14px;padding:14px;margin-top:12px;}
#news-lab .nl-review-summary p {margin:6px 0 0;}
</style>
<script>
(()=>{
'use strict';
const SAMPLE_URL='__NEWS_SAMPLE__';
document.getElementById('news-lab')?.remove();
const root=document.createElement('section');root.id='news-lab';root.setAttribute('aria-label','같은 사진, 다른 이야기');
root.innerHTML=`
<button type="button" id="nl-back" class="nl-quiet">← 가짜뉴스 게임 안내로</button>
<h2 id="nl-heading" tabindex="-1">📷 같은 사진, 다른 이야기</h2>
<p class="nl-muted">사진의 범위와 제목이 바꾸는 인상을 비교하고, AI에게 수정한 근거를 확인받아요.</p>
<details class="nl-privacy"><summary>🔒 사진과 AI 평가 안내</summary><p>촬영은 선택이고 마이크는 사용하지 않아요. 자르기와 편집은 브라우저에서 해요. <b>AI 전송 동의 후 평가 버튼을 누를 때만</b> 원본·수정 전후 사진과 제목·설명을 앱 서버를 거쳐 Google Gemini로 보내요. 앱은 사진을 파일·DB·로그에 저장하지 않으며 외부 AI 서비스의 처리 정책은 별도로 적용돼요. 개인정보가 보이는 사진 대신 깡지 예시로 체험할 수 있어요.</p></details>
<ol class="nl-steps" aria-label="체험 순서">${['사진 준비','편집','근거 확인','수정·AI 평가','비교 리포트'].map((label,i)=>`<li><button type="button" data-step="${i}">${i+1} ${label}</button></li>`).join('')}</ol>
<section class="nl-box" id="nl-source"><h3 tabindex="-1">① 원본 준비하기</h3><p>주변 상황이 함께 보이는 사진을 준비해요. 얼굴을 찍지 않아도 돼요.</p><div class="nl-toolbar"><button id="nl-start" type="button" class="nl-primary">📷 촬영 / 다시 촬영</button><button id="nl-sample" type="button">🐻 깡지 예시로 체험</button><button id="nl-stop" type="button" class="nl-quiet" hidden>카메라 끄기</button></div><p id="nl-status" role="status" aria-live="polite">카메라가 꺼져 있어요.</p><div class="nl-camera"><video id="nl-video" autoplay muted playsinline hidden></video><div class="nl-actions"><button id="nl-capture" type="button" class="nl-primary" hidden disabled>이 장면 촬영하기</button></div></div></section>
<section class="nl-box" id="nl-edit" hidden><h3 tabindex="-1">② 범위와 제목 바꾸기</h3><div class="nl-grid"><div class="nl-photo-card"><b class="nl-photo-label">원본 전체</b><canvas id="nl-original"></canvas><label for="nl-context">실제로 보이는 상황</label><textarea id="nl-context" maxlength="180" rows="2" placeholder="사진에서 확인할 수 있는 장면을 적어 주세요."></textarea><p id="nl-context-error" class="nl-error" role="status"></p></div><div class="nl-photo-card"><b class="nl-photo-label">처음 만든 게시물</b><canvas id="nl-crop"></canvas><label for="nl-title">게시물 제목</label><textarea id="nl-title" maxlength="120" rows="2" placeholder="이 범위만 보면 어떤 제목이 붙을까요?"></textarea><p id="nl-title-error" class="nl-error" role="status"></p></div></div><div class="nl-sliders">${sliders('')}</div><p class="nl-muted">학습용 제목만 적어 주세요. 사진을 잘랐다는 이유만으로 잘못된 게시물인 것은 아니에요.</p><div class="nl-actions"><button id="nl-to-check" type="button" class="nl-primary">원본과 근거 비교하기 →</button></div></section>
<section class="nl-box" id="nl-check" hidden><div class="nl-section-head"><h3 tabindex="-1">③ 이 게시물의 근거는 충분할까요?</h3><button id="nl-back-edit" type="button" class="nl-quiet">← 편집으로</button></div><div class="nl-grid"><div class="nl-photo-card"><b class="nl-photo-label">내가 고른 원본</b><canvas id="nl-my-full"></canvas><p id="nl-my-context"></p></div><div class="nl-photo-card"><b class="nl-photo-label">내가 만든 게시물</b><canvas id="nl-my-before"></canvas><p id="nl-my-title" class="nl-headline"></p></div></div>
<div id="nl-sample-quiz" hidden><p class="nl-muted">지금 보이는 깡지 예시에서 사실과 추측을 구분해요.</p><div id="nl-quiz-fields"></div><p id="nl-quiz-error" class="nl-error" role="status"></p><button id="nl-quiz-submit" type="button">선택한 근거 확인하기</button></div>
<div id="nl-diagnose"><fieldset id="nl-issue-field"><legend>원본과 비교해서 어떻게 할까요?</legend><label class="nl-option"><input id="nl-issue-frame" type="checkbox">잘린 주변 인물·배경을 더 보여 주기</label><label class="nl-option"><input id="nl-issue-title" type="checkbox">사진만으로 단정한 제목을 고치기</label><label class="nl-option"><input id="nl-issue-keep" type="checkbox">지금 범위와 제목을 유지하고 근거 설명하기</label></fieldset><p id="nl-issue-error" class="nl-error" role="status"></p><button id="nl-issue-hint" type="button" class="nl-quiet">💡 고칠 부분을 못 찾겠어요</button><p id="nl-issue-tip" class="nl-note" hidden>원본에는 있지만 게시물에서는 보이지 않는 인물·배경이 있나요? 제목이 사진 속 행동의 이유나 마음까지 단정하나요? 둘 다 아니라면 유지하고 근거를 설명해도 돼요.</p><div class="nl-actions"><button id="nl-to-repair" type="button" class="nl-primary">내 판단을 적용하고 확인하기 →</button></div></div></section>
<section class="nl-box" id="nl-repair" hidden><div class="nl-section-head"><h3 tabindex="-1">④ 맥락에 맞게 고치고 AI 평가받기</h3><button id="nl-back-check" type="button" class="nl-quiet">← 근거 확인으로</button></div><p id="nl-repair-task" class="nl-note"></p><div class="nl-grid"><div class="nl-photo-card"><b class="nl-photo-label">수정 전</b><canvas id="nl-before"></canvas><p id="nl-before-title" class="nl-headline"></p></div><div class="nl-photo-card"><b class="nl-photo-label">수정 후 · 필요한 맥락이 보이게</b><canvas id="nl-after"></canvas><div class="nl-sliders">${sliders('fix-')}</div><p id="nl-frame-error" class="nl-error" role="status"></p><label for="nl-fixed-title">사진의 근거에 맞는 제목</label><input id="nl-fixed-title" maxlength="120" type="text"><p id="nl-fixed-title-error" class="nl-error" role="status"></p></div></div>
<div class="nl-grid"><div><label for="nl-missing">무엇이 빠지거나 단정됐나요?</label><textarea id="nl-missing" maxlength="300" rows="2" placeholder="유지한다면 지금 근거가 충분한 이유를 적어 주세요."></textarea><p id="nl-missing-error" class="nl-error" role="status"></p></div><div><label for="nl-reason">어떻게 오해를 줄였나요?</label><textarea id="nl-reason" maxlength="300" rows="2" placeholder="내가 고친 내용과 이유를 적어 주세요."></textarea><p id="nl-reason-error" class="nl-error" role="status"></p></div></div>
<label class="nl-option"><input id="nl-consent" type="checkbox">원본·수정 전후 사진과 제목·설명이 앱 서버를 거쳐 Google Gemini로 전송되는 데 동의해요.</label><p id="nl-consent-error" class="nl-error" role="status"></p><div id="nl-review" aria-live="polite"></div><p id="nl-finish-error" class="nl-error" role="status"></p><div class="nl-actions"><button id="nl-finish" type="button" class="nl-primary">✨ 사진과 설명 AI 평가받기</button><button id="nl-show-report" type="button" hidden>비교 리포트 보기 →</button></div><p class="nl-muted">사진과 설명의 근거를 평가해요. 실제 사건의 진위를 인증하는 기능은 아니에요.</p></section>
<section class="nl-box" id="nl-done" hidden><div class="nl-report-head"><span>PHOTO REVIEW</span><h3 tabindex="-1">✨ 내가 바로잡은 이야기</h3><p id="nl-done-summary"></p></div><div class="nl-grid"><div class="nl-photo-card"><b class="nl-photo-label">수정 전</b><canvas id="nl-final-before"></canvas><p id="nl-final-old-title" class="nl-headline"></p></div><div class="nl-photo-card nl-after-card"><b class="nl-photo-label">수정 후</b><canvas id="nl-final-after"></canvas><p id="nl-final-new-title" class="nl-headline"></p></div></div><div id="nl-change-chips" class="nl-chips"></div><div class="nl-grid"><article class="nl-report-card"><h4>🔍 내가 찾은 문제</h4><p id="nl-final-missing"></p></article><article class="nl-report-card"><h4>🛠️ 내가 고친 방법</h4><p id="nl-final-reason"></p></article></div><div id="nl-final-review"></div><div class="nl-actions"><button id="nl-revise" type="button">다시 고쳐 보기</button><button id="nl-restart" type="button" class="nl-quiet">사진 지우고 새로 시작</button><button id="nl-return" type="button" class="nl-primary">가짜뉴스 게임 안내로</button></div></section>`;
document.body.appendChild(root);
const el=id=>root.querySelector('#nl-'+id), source=document.createElement('canvas'), sample=document.createElement('canvas'), beforeCanvas=document.createElement('canvas');
let unlocked=0,stream=null,cameraToken=0,opened=false,hasPhoto=false,mode='',step=0,before=null,quizPassed=false,samplePromise=null,revision=0,pending=null,review=null,timer=null;
const stages=['source','edit','check','repair','done'];
const QUESTIONS=[['깡지가 쓰레기를 줍고 있다.','fact','집게로 쓰레기를 줍는 행동이 보여요.'],['친구들은 깡지에게 청소를 떠넘겼다.','guess','친구들도 청소해요. 떠넘겼다는 이유는 확인되지 않아요.'],['친구들이 깡지를 싫어한다.','guess','사진만으로 인물의 마음은 알 수 없어요.']];
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sliders(prefix){return `<label>범위 <output id="nl-${prefix}z-value">1.0배</output><input aria-label="${prefix?'수정 후':'편집본'} 확대 배율" id="nl-${prefix}zoom" type="range" min="1" max="3" step="0.1" value="1"></label><label>가로<input aria-label="${prefix?'수정 후':'편집본'} 가로 위치" id="nl-${prefix}x" type="range" min="0" max="100" value="50"></label><label>세로<input aria-label="${prefix?'수정 후':'편집본'} 세로 위치" id="nl-${prefix}y" type="range" min="0" max="100" value="50"></label>`;}
function resizeLab(){if(typeof resize==='function')resize(true);}
new ResizeObserver(resizeLab).observe(root);
function localFocus(node){node?.scrollIntoView({block:'center',behavior:'smooth'});node?.focus({preventScroll:true});resizeLab();}
function error(field,message){const box=el(field+'-error');if(box)box.textContent=message;const target=el(field==='frame'?'after':field==='issue'?'issue-field':field==='quiz'?'quiz-fields':field);if(target){target.classList.add('nl-attention');setTimeout(()=>target.classList.remove('nl-attention'),1800);localFocus(target);}return false;}
function clearErrors(){root.querySelectorAll('.nl-error').forEach(n=>n.textContent='');}
function refreshSteps(){root.querySelectorAll('[data-step]').forEach((b,i)=>{b.disabled=i>unlocked;b.setAttribute('aria-current',i===step?'step':'false');});}
function cancelPending(){if(timer)clearTimeout(timer);timer=null;pending=null;el('finish').disabled=false;el('finish').textContent='✨ 사진과 설명 AI 평가받기';}
function invalidate(n){revision++;unlocked=Math.min(unlocked,n);review=null;cancelPending();el('review').replaceChildren();el('show-report').hidden=true;refreshSteps();}
function stop(){cameraToken++;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}el('video').srcObject=null;el('video').hidden=true;el('capture').hidden=true;el('capture').disabled=true;el('stop').hidden=true;el('start').disabled=false;}
function setStep(n){if(n!==0)stop();if(n!==3&&pending)cancelPending();step=n;unlocked=Math.max(unlocked,n);stages.forEach((id,i)=>el(id).hidden=i!==n);refreshSteps();resizeLab();if(opened){el(stages[n]).querySelector('h3')?.focus({preventScroll:true});if(typeof toTop==='function')toTop();}}
function copy(from,to){to.width=from.width;to.height=from.height;to.getContext('2d').drawImage(from,0,0);}
function controls(prefix){return{z:Number(el(prefix+'zoom').value),x:Number(el(prefix+'x').value),y:Number(el(prefix+'y').value)};}
function rect(c){return{x:(1-1/c.z)*c.x/100,y:(1-1/c.z)*c.y/100,w:1/c.z,h:1/c.z};}
function paintCrop(from,to,c){to.width=from.width;to.height=from.height;const r=rect(c);to.getContext('2d').drawImage(from,r.x*from.width,r.y*from.height,r.w*from.width,r.h*from.height,0,0,to.width,to.height);}
function draw(prefix,target){if(!hasPhoto)return;const c=controls(prefix);paintCrop(source,el(target),c);el(prefix+'z-value').textContent=c.z.toFixed(1)+'배';el(prefix+'x').disabled=el(prefix+'y').disabled=c.z===1;}
function setControls(prefix,c){['zoom','x','y'].forEach((id,i)=>el(prefix+id).value=[c.z,c.x,c.y][i]);}
function textProblem(value){const s=value.trim();if(!s)return '내용을 적어 주세요.';if(!/[가-힣a-zA-Z0-9]/.test(s))return '사진에서 본 내용이나 판단 이유를 적어 주세요.';return '';}
function normalize(s){return s.trim().replace(/\s+/g,' ');}
function resetQuiz(){quizPassed=mode!=='sample';root.querySelectorAll('[name^="nl-q"]').forEach(n=>n.checked=false);root.querySelectorAll('.nl-feedback').forEach(n=>n.textContent='');el('diagnose').hidden=mode==='sample';}
function wipe(){cancelPending();revision++;unlocked=0;stop();hasPhoto=false;mode='';before=null;review=null;root.querySelectorAll('canvas').forEach(c=>{c.width=c.height=1;});root.querySelectorAll('input[type=text],textarea').forEach(n=>n.value='');root.querySelectorAll('input[type=checkbox]').forEach(n=>n.checked=false);clearErrors();el('review').replaceChildren();el('issue-tip').hidden=true;el('show-report').hidden=true;resetQuiz();el('status').textContent='카메라가 꺼져 있어요.';setStep(0);}
function close(){opened=false;wipe();root.style.display='none';document.getElementById('app').hidden=false;if(typeof setPlayActive==='function')setPlayActive(false);document.getElementById('nl-launch')?.focus();resizeLab();}
window.openNewsLab=()=>{opened=true;document.getElementById('app').hidden=true;root.style.display='block';if(typeof setPlayActive==='function')setPlayActive(true);setStep(step);};
function loadSample(){if(sample.dataset.ready==='yes')return Promise.resolve();if(samplePromise)return samplePromise;samplePromise=new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{sample.width=Math.min(img.naturalWidth,960);sample.height=Math.round(sample.width*img.naturalHeight/img.naturalWidth);sample.getContext('2d').drawImage(img,0,0,sample.width,sample.height);sample.dataset.ready='yes';resolve();};img.onerror=reject;if(!SAMPLE_URL.startsWith('data:image/'))reject(Error('missing'));else img.src=SAMPLE_URL;}).catch(e=>{samplePromise=null;throw e;});return samplePromise;}
function ready(kind){const fresh=document.createElement('canvas');copy(source,fresh);wipe();copy(fresh,source);mode=kind;hasPhoto=true;copy(source,el('original'));setControls('',kind==='sample'?{z:2.5,x:0,y:55}:{z:1,x:50,y:50});el('context').value=kind==='sample'?'깡지와 친구들이 함께 공원에서 쓰레기를 줍고 있어요.':'';el('title').value=kind==='sample'?'친구들은 빠지고 깡지만 혼자 공원을 청소해요.':'';draw('','crop');setStep(1);}
el('start').onclick=async()=>{stop();const token=++cameraToken;el('start').disabled=true;el('status').textContent='카메라 사용을 허용해 주세요. 촬영 없이 깡지 예시도 사용할 수 있어요.';try{if(!navigator.mediaDevices?.getUserMedia)throw Error('unsupported');const next=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:960},height:{ideal:540}},audio:false});if(token!==cameraToken||!opened){next.getTracks().forEach(t=>t.stop());return;}stream=next;el('video').srcObject=next;el('video').hidden=false;el('capture').hidden=false;el('stop').hidden=false;await el('video').play();if(token===cameraToken){el('capture').disabled=false;el('status').textContent='촬영 버튼을 누르면 한 장을 찍어요.';}}catch(e){if(token!==cameraToken)return;stop();el('status').textContent='카메라를 사용할 수 없어요. 권한을 확인하거나 깡지 예시로 체험해 주세요.';}};
el('capture').onclick=()=>{const v=el('video');if(!stream||!v.videoWidth)return;source.width=Math.min(v.videoWidth,960);source.height=Math.round(source.width*v.videoHeight/v.videoWidth);source.getContext('2d').drawImage(v,0,0,source.width,source.height);ready('camera');};
el('sample').onclick=async()=>{stop();const token=++cameraToken;try{await loadSample();if(token!==cameraToken||!opened)return;copy(sample,source);ready('sample');}catch(e){el('status').textContent='예시 그림을 불러오지 못했어요. 예시 이미지 파일을 확인해 주세요.';}};
el('stop').onclick=()=>{stop();el('status').textContent='카메라를 껐어요.';};el('back').onclick=close;el('return').onclick=close;el('restart').onclick=wipe;
['zoom','x','y'].forEach(id=>el(id).oninput=()=>{draw('','crop');before=null;resetQuiz();invalidate(1);});
['context','title'].forEach(id=>el(id).oninput=()=>{before=null;resetQuiz();invalidate(1);});
['fix-zoom','fix-x','fix-y'].forEach(id=>el(id).oninput=()=>{draw('fix-','after');invalidate(3);});
['fixed-title','missing','reason','consent'].forEach(id=>el(id).addEventListener('input',()=>{invalidate(3);clearErrors();}));
root.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.step);if(n<=unlocked)setStep(n);});
el('to-check').onclick=()=>{clearErrors();if(!hasPhoto)return;if(textProblem(el('context').value))return error('context',textProblem(el('context').value));if(textProblem(el('title').value))return error('title',textProblem(el('title').value));before={crop:controls(''),title:normalize(el('title').value),context:normalize(el('context').value)};copy(el('crop'),beforeCanvas);copy(source,el('my-full'));copy(beforeCanvas,el('my-before'));el('my-context').textContent=before.context;el('my-title').textContent=before.title;el('sample-quiz').hidden=mode!=='sample';el('quiz-fields').innerHTML=mode==='sample'?QUESTIONS.map((q,i)=>`<fieldset><legend>${i+1}. ${escape(q[0])}</legend><label class="nl-option"><input type="radio" name="nl-q${i}" value="fact">사진에서 확인할 수 있는 사실</label><label class="nl-option"><input type="radio" name="nl-q${i}" value="guess">추가 확인이 필요한 추측</label><p id="nl-q-feedback-${i}" class="nl-feedback" role="status"></p></fieldset>`).join(''):'';resetQuiz();el('quiz-fields').querySelectorAll('input').forEach(n=>n.onchange=()=>{quizPassed=false;el('diagnose').hidden=true;invalidate(2);});setStep(2);};
el('quiz-submit').onclick=()=>{let correct=0,first=null;QUESTIONS.forEach((q,i)=>{const selected=root.querySelector(`input[name="nl-q${i}"]:checked`);const ok=selected?.value===q[1];if(ok)correct++;else if(!first)first=root.querySelector(`input[name="nl-q${i}"]`);el('q-feedback-'+i).textContent=selected?(ok?'✓ ':'다시 확인해요. ')+q[2]:'하나를 선택해 주세요.';});quizPassed=correct===QUESTIONS.length;el('diagnose').hidden=!quizPassed;if(quizPassed){el('quiz-error').textContent='';localFocus(el('issue-field'));}else error('quiz','사진에서 직접 보이는 사실과 추측을 다시 구분해 주세요.');};
['issue-frame','issue-title','issue-keep'].forEach(id=>el(id).onchange=()=>{if(id==='issue-keep'&&el(id).checked){el('issue-frame').checked=el('issue-title').checked=false;}else if(el(id).checked)el('issue-keep').checked=false;invalidate(2);clearErrors();});
el('issue-hint').onclick=()=>{el('issue-tip').hidden=!el('issue-tip').hidden;localFocus(el('issue-tip'));};
el('to-repair').onclick=()=>{clearErrors();if(!before||!quizPassed)return error('quiz','먼저 근거를 확인해 주세요.');const frame=el('issue-frame').checked,title=el('issue-title').checked,keep=el('issue-keep').checked;if(!frame&&!title&&!keep)return error('issue','수정할 부분이나 유지할 판단을 선택해 주세요.');copy(beforeCanvas,el('before'));el('before-title').textContent=before.title;setControls('fix-',before.crop);draw('fix-','after');el('fixed-title').value=before.title;el('repair-task').textContent=keep?'지금 범위와 제목을 유지할 수 있다고 판단한 근거를 설명해 주세요.':'내가 선택한 수정: '+[frame?'주변 맥락 더 보여 주기':'',title?'제목 고치기':''].filter(Boolean).join(' · ');invalidate(3);setStep(3);};
function jpeg(canvas){const out=document.createElement('canvas'),scale=Math.min(1,720/Math.max(canvas.width,canvas.height));out.width=Math.max(1,Math.round(canvas.width*scale));out.height=Math.max(1,Math.round(canvas.height*scale));out.getContext('2d').drawImage(canvas,0,0,out.width,out.height);return out.toDataURL('image/jpeg',.72);}
function reviewCards(r){const names={frame:'사진 범위',title:'제목의 근거',missing:'문제 찾기',reason:'수정 이유'};return `<div class="nl-review-summary">${r.approved?'✅ 근거 연결 완료':'🔎 다시 살펴볼 부분'} · <b>${r.score} / 8</b><p>${escape(r.summary)}</p></div><div class="nl-grid">${r.rubric.map(x=>`<article class="nl-report-card ${x.score===2?'nl-good':'nl-improve'}"><h4>${x.score===2?'✓':'↗'} ${names[x.field]} · ${x.score}/2</h4><p>${escape(x.feedback)}</p></article>`).join('')}</div><div class="nl-grid"><article class="nl-report-card nl-good"><h4>🌱 잘한 점</h4><p>${escape(r.strength)}</p></article><article class="nl-report-card nl-improve"><h4>💡 다음 확인</h4><p>${escape(r.next_step)}</p></article></div>`;}
function showReport(){if(!review?.approved)return;copy(beforeCanvas,el('final-before'));copy(el('after'),el('final-after'));el('final-old-title').textContent=before.title;el('final-new-title').textContent=normalize(el('fixed-title').value);el('final-missing').textContent=el('missing').value.trim();el('final-reason').textContent=el('reason').value.trim();el('done-summary').textContent=review.summary;el('change-chips').replaceChildren();const c=controls('fix-');for(const label of [`보이는 범위 ${Math.round(100/before.crop.z**2)}% → ${Math.round(100/c.z**2)}%`,normalize(el('fixed-title').value)===before.title?'제목 유지 · 근거 확인':'제목 수정',`AI 학습 평가 ${review.score}/8`]){const span=document.createElement('span');span.textContent=label;el('change-chips').appendChild(span);}el('final-review').innerHTML=reviewCards(review);setStep(4);}
el('finish').onclick=()=>{if(pending||!before)return;clearErrors();for(const id of ['fixed-title','missing','reason'])if(textProblem(el(id).value))return error(id,textProblem(el(id).value));if(!el('consent').checked)return error('consent','AI 전송 안내를 확인하고 동의해 주세요.');const id='photo-'+Date.now()+'-'+Math.random().toString(36).slice(2);pending={id,revision};el('finish').disabled=true;el('finish').textContent='사진과 설명을 비교하고 있어요…';el('review').innerHTML='<p class="nl-note">AI가 사진과 설명의 근거를 확인하고 있어요. 잠시 기다려 주세요.</p>';try{sendResult({game:'fakenews',type:'photo_grade',id,consent:true,context:before.context,before_title:before.title,after_title:normalize(el('fixed-title').value),missing:el('missing').value.trim(),reason:el('reason').value.trim(),original:jpeg(source),before_image:jpeg(beforeCanvas),after_image:jpeg(el('after'))});timer=setTimeout(()=>{if(pending?.id!==id)return;cancelPending();el('review').replaceChildren();error('finish','평가 응답을 기다리다 중단됐어요. 입력은 그대로 있으니 다시 평가해 주세요.');},60000);}catch(e){cancelPending();error('finish','사진을 전송하지 못했어요. 다시 시도해 주세요.');}};
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='streamlit:render')return;const result=event.data.args?.photo_review;if(!pending||!result||result.id!==pending.id||pending.revision!==revision)return;cancelPending();if(!result.ok){el('review').replaceChildren();error('finish',result.message||'AI 평가를 완료하지 못했어요.');return;}review=result;el('review').innerHTML=reviewCards(result);if(result.approved){el('show-report').hidden=false;showReport();}else{const target=result.rubric.find(x=>x.score===0)||result.rubric.find(x=>x.score===1);if(target)error(target.field==='title'?'fixed-title':target.field,target.feedback);else localFocus(el('review'));}resizeLab();});
el('show-report').onclick=showReport;el('back-edit').onclick=()=>setStep(1);el('back-check').onclick=()=>setStep(2);el('revise').onclick=()=>setStep(3);
window.addEventListener('pagehide',()=>{opened=false;wipe();});document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();el('status').textContent='화면을 벗어나 카메라를 껐어요.';}});setStep(0);
})();

</script>
